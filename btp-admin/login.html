<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Berkah POS - Super Admin Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><style>body{font-family:Arial;background:#f6f6f6;margin:0}.box{max-width:460px;margin:8vh auto;background:#fff;border:1px solid #bbb;padding:22px}label{display:block;font-weight:700;font-size:12px;margin:12px 0 4px}input,button{width:100%;padding:10px;font:inherit;box-sizing:border-box}button{margin-top:16px;background:#111;color:#fff;border:0;font-weight:700}.status{white-space:pre-wrap;margin-top:14px;padding:10px;border:1px solid #aaa}.bad{border-color:#c5221f}.ok{border-color:#188038}</style></head><body><div class="box"><h1>Super Admin Login</h1><p>Write hanya untuk authenticated super admin.</p><label>Supabase URL</label><input id="url" placeholder="https://xxxx.supabase.co"><label>Anon / Publishable Key</label><input id="key" type="password"><label>Email</label><input id="email" type="email" value="satria@berkahtigaputeri.com" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="login">LOGIN</button><div id="status" class="status">Belum login.</div></div><script>
const q=new URLSearchParams(location.search);const cfg=BTP_AUTH.cfg();url.value=cfg.url;key.value=cfg.key;
BTP_AUTH.getAdmin().then(u=>{if(u){status.textContent=`Sudah login: ${u.email}`;status.className='status ok';}});
login.onclick=async()=>{try{login.disabled=true;status.textContent='Login...';const u=await BTP_AUTH.login(url.value,key.value,email.value,password.value);status.textContent=`Login OK: ${u.email}`;status.className='status ok';const next=q.get('next')||'clients.html';location.replace(next);}catch(e){status.textContent=`Login gagal: ${e.message}`;status.className='status bad';}finally{login.disabled=false;password.value='';}};
</script></body></html>
