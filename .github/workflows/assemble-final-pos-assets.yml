name: Assemble Final Pos production assets

on:
  push:
    branches: [main]
    paths:
      - '.final-pos-staging/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Assemble and validate FINAL assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p btp-admin config
          cat .final-pos-staging/admin.gz.b64.* | base64 --decode | gzip --decompress > btp-admin/final-pos-template-admin.html
          cat .final-pos-staging/excel.b64.* | base64 --decode > config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx
          test -s btp-admin/final-pos-template-admin.html
          test -s config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx
          grep -q 'Berkah POS - FINAL PRODUCTION' btp-admin/final-pos-template-admin.html
          python - <<'PY'
          from openpyxl import load_workbook
          p='config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx'
          wb=load_workbook(p, read_only=True, data_only=True)
          assert wb.sheetnames == ['README_PRODUCTION','TEMPLATES','GLOBAL','TENANTS_MASTER','DEVICES','SERVICES','APP_CONFIG_EXPORT']
          assert wb['APP_CONFIG_EXPORT'].max_row == 353
          assert wb['TENANTS_MASTER'].max_row == 101
          assert wb['DEVICES'].max_row == 109
          assert wb['SERVICES'].max_row == 141
          print('FINAL assets verified: 352 config keys, 100 tenants, 108 devices, 140 services')
          PY

      - name: Publish FINAL assets and remove one-shot staging helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add btp-admin/final-pos-template-admin.html config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx
          git rm -r .final-pos-staging .github/workflows/assemble-final-pos-assets.yml
          git commit -m 'feat: publish Final Pos Excel A + Web C production assets'
          git push origin HEAD:main
