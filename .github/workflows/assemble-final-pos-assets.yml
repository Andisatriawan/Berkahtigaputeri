name: Assemble Final Pos production assets

on:
  push:
    branches: [main]
    paths:
      - '.final-pos-staging/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workbook validator
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Assemble reference HTML and Excel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p btp-admin config
          gzip --decompress --stdout .final-pos-staging/admin.html.gz > btp-admin/final-pos-template-admin.html
          cp .final-pos-staging/final.xlsx config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx
          test -s btp-admin/final-pos-template-admin.html
          test -s config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx
          grep -q 'Berkah POS - FINAL PRODUCTION' btp-admin/final-pos-template-admin.html
          python - <<'PY'
          from openpyxl import load_workbook
          p='config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx'
          wb=load_workbook(p, read_only=True, data_only=True)
          assert wb['APP_CONFIG_EXPORT'].max_row == 353
          assert wb['TENANTS_MASTER'].max_row == 101
          assert wb['DEVICES'].max_row == 109
          assert wb['SERVICES'].max_row == 141
          print('Final Pos assets verified')
          PY

      - name: Commit production assets and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .final-pos-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add btp-admin/final-pos-template-admin.html config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx .final-pos-staging
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'feat: publish Final Pos Excel A + Web C production assets'
          git push origin HEAD:main
