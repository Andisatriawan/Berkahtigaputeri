name: Deploy btp-admin to GitHub Pages
on:
  push:
    branches: [main, feat/simulated-hardware-supabase-admin-a19cb3f]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: List files debug
        run: |
          pwd
          ls -la
          ls -la btp-admin/ || echo "btp-admin NOT FOUND IN THIS BRANCH"
          ls -la docs/permanent/ || echo "docs/permanent not found"
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./btp-admin
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
