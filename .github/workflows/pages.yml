name: Deploy btp-admin to GitHub Pages
on:
  push:
    branches: [feat/simulated-hardware-supabase-admin-a19cb3f]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simulated-hardware-supabase-admin-a19cb3f
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: btp-admin/
      - id: deployment
        uses: actions/deploy-pages@v4
