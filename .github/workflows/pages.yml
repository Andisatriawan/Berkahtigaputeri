name: Deploy btp-admin to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'btp-admin/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Fedora]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare stable Pages layout
        run: |
          set -euxo pipefail
          test -f btp-admin/index.html
          rm -rf _site
          mkdir -p _site
          cp -R btp-admin _site/btp-admin
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=btp-admin/">' > _site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path:./_site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
