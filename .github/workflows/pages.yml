name: Deploy btp-admin to GitHub Pages
on:
  push:
    branches:
      - main
      - feat/simulated-hardware-supabase-admin-a19cb3f
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - name: Prepare Pages artifact with /btp-admin/ path
        run: |
          rm -rf _site
          mkdir -p _site/btp-admin
          cp -a btp-admin/. _site/btp-admin/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@v4
