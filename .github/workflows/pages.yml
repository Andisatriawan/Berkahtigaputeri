name: Deploy btp-admin to GitHub Pages
on:
  push:
    branches:
      - main
      - feat/simulated-hardware-supabase-admin-a19cb3f
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - name: Keep /btp-admin/ compatibility URL
        run: |
          mkdir -p btp-admin/btp-admin
          cat > btp-admin/btp-admin/index.html <<'EOF'
          <!doctype html>
          <html lang="id">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=../">
            <link rel="canonical" href="../">
            <title>Berkah POS Admin</title>
          </head>
          <body>
            <a href="../">Buka Berkah POS Admin</a>
          </body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: btp-admin
      - id: deployment
        uses: actions/deploy-pages@v4
