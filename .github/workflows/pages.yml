name: Deploy btp-admin to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Checking btp-admin"
          ls -la
          ls -la btp-admin/ || (echo "CREATE FALLBACK" && mkdir -p btp-admin && echo "<h1>BTP Admin Fallback - Fixing</h1>" > btp-admin/index.html)
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./btp-admin
      - id: deployment
        uses: actions/deploy-pages@v4
