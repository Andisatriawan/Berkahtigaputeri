name: 02 · UAT Infinix Release APK
on:
  push:
    branches: [main]
    paths:
      - 'pos-app/**'
      - '.github/workflows/build.yml'
      - '.gitleaksignore'
  pull_request:
    branches: [main]
    paths:
      - 'pos-app/**'
      - '.gitleaksignore'
permissions:
  contents: read
jobs:
  build:
    runs-on: [self-hosted, Fedora]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pos-app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          podman run --rm -v "$PWD:/repo:Z" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source . --log-opts="--all" --redact -v
      - name: Verify Fedora deps
        shell: bash
        run: |
          sqlite3 --version
          podman --version
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare missing Android scaffold
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x android/gradlew || ! -f android/app/src/main/AndroidManifest.xml ]]; then
            template="${RUNNER_TEMP}/pos-android-template"
            rm -rf "$template"
            flutter create --no-pub --platforms=android --org com.berkahtigaputeri --project-name pos "$template"
            mkdir -p android
            cp -an "$template/android/." android/
            if [[ ! -f .metadata ]]; then
              cp "$template/.metadata" .metadata
            fi
          fi

          # Use the Java 17 JDK selected by actions/setup-java and cap Gradle
          # memory so the self-hosted laptop runner does not overcommit RAM.
          gradle_props="android/gradle.properties"
          touch "$gradle_props"
          if grep -q '^org.gradle.jvmargs=' "$gradle_props"; then
            sed -i -E 's/-Xmx[0-9]+[kKmMgG]+/-Xmx2G/; s/-XX:MaxMetaspaceSize=[0-9]+[kKmMgG]+/-XX:MaxMetaspaceSize=1G/' "$gradle_props"
          else
            printf '%s\n' 'org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8' >> "$gradle_props"
          fi
          if grep -q '^org.gradle.java.home=' "$gradle_props"; then
            sed -i "s|^org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" "$gradle_props"
          else
            printf 'org.gradle.java.home=%s\n' "$JAVA_HOME" >> "$gradle_props"
          fi
          if grep -q '^org.gradle.workers.max=' "$gradle_props"; then
            sed -i 's/^org.gradle.workers.max=.*/org.gradle.workers.max=2/' "$gradle_props"
          else
            printf '%s\n' 'org.gradle.workers.max=2' >> "$gradle_props"
          fi
          if grep -q '^org.gradle.parallel=' "$gradle_props"; then
            sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' "$gradle_props"
          else
            printf '%s\n' 'org.gradle.parallel=false' >> "$gradle_props"
          fi

          test -x android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradle.properties
          test -f .metadata
          grep -F "org.gradle.java.home=$JAVA_HOME" android/gradle.properties
          grep -E -- '-Xmx2G' android/gradle.properties
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release app bundle
        run: flutter build appbundle --release
      - name: Upload release app bundle
        uses: actions/upload-artifact@v6
        with:
          name: berkahtigaputeri-pos-release-aab
          path: pos-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
