name: 02 · UAT Infinix Release APK
on:
  push:
    branches: [main]
    paths:
      - 'pos-app/**'
      - '.github/workflows/build.yml'
      - '.gitleaksignore'
  pull_request:
    branches: [main]
    paths:
      - 'pos-app/**'
      - '.gitleaksignore'
permissions:
  contents: read
jobs:
  build:
    runs-on: [self-hosted, Fedora]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pos-app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          podman run --rm -v "$PWD:/repo:Z" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source . --log-opts="--all" --redact -v
      - name: Verify Fedora deps
        shell: bash
        run: |
          sqlite3 --version
          podman --version
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release app bundle
        run: flutter build appbundle --release
      - name: Upload release app bundle
        uses: actions/upload-artifact@v6
        with:
          name: berkahtigaputeri-pos-release-aab
          path: pos-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
