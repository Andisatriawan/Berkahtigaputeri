name: 02 · UAT Infinix Release APK

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-app

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks full history)
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source . --log-opts="--all" --redact -v

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Install SQLite FFI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM_GRADLE=""
          if [ -f android/app/build.gradle ]; then
            CUSTOM_GRADLE="$RUNNER_TEMP/app-build.gradle"
            cp android/app/build.gradle "$CUSTOM_GRADLE"
          fi

          rm -rf "$RUNNER_TEMP/berkahtigaputeri_android"
          flutter create \
            --platforms=android \
            --org com.berkahtigaputeri \
            --project-name pos \
            "$RUNNER_TEMP/berkahtigaputeri_android"

          rm -rf android
          cp -R "$RUNNER_TEMP/berkahtigaputeri_android/android" android

          if [ -n "$CUSTOM_GRADLE" ]; then
            rm -f android/app/build.gradle.kts
            cp "$CUSTOM_GRADLE" android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Upload release app bundle
        uses: actions/upload-artifact@v4
        with:
          name: berkahtigaputeri-pos-release-aab
          path: pos-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
