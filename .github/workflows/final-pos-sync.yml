name: Final Pos Sync (fail-closed)
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'config/**'
      - 'scripts/sync_excel_to_supabase.py'
      - '.github/workflows/final-pos-sync.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'config/**'
      - 'scripts/sync_excel_to_supabase.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-pos-sync:
    name: Final Pos Sync (fail-closed)
    runs-on: [self-hosted, Fedora]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install openpyxl requests
      - run: python3 scripts/sync_excel_to_supabase.py --dry-run
