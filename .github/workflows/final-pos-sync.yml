name: Final Pos Sync (fail-closed)
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'config/**'
      - 'scripts/sync_excel_to_supabase.py'
      - '.github/workflows/final-pos-sync.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'config/**'
      - 'scripts/sync_excel_to_supabase.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-pos-sync:
    name: Final Pos Sync (fail-closed)
    runs-on: [self-hosted, Fedora]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies and dry-run sync
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "${RUNNER_TEMP}/pos-sync-venv"
          "${RUNNER_TEMP}/pos-sync-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/pos-sync-venv/bin/python" -m pip install openpyxl requests
          "${RUNNER_TEMP}/pos-sync-venv/bin/python" scripts/sync_excel_to_supabase.py --dry-run
