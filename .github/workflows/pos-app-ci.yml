name: Canonical POS App CI

on:
  pull_request:
    paths:
      - "pos-app/**"
      - ".github/workflows/pos-app-ci.yml"
  push:
    branches: ["**"]
    paths:
      - "pos-app/**"
      - ".github/workflows/pos-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-pos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and Android compile-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        working-directory: pos-app
        run: flutter pub get

      - name: Analyze Dart
        working-directory: pos-app
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: pos-app
        run: flutter test --no-pub

      # The repository tracks only a partial Android host. Generate the
      # missing host inside this disposable CI checkout, retaining the
      # committed canonical app Gradle configuration/package identity.
      - name: Generate temporary Android host
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          cp pos-app/android/app/build.gradle "$temp_dir/canonical-app-build.gradle"
          flutter create \
            --platforms=android \
            --project-name pos \
            --org com.berkahtigaputeri \
            --overwrite \
            "$temp_dir/seed"

          rm -rf pos-app/android
          mkdir -p pos-app/android
          cp -a "$temp_dir/seed/android/." pos-app/android/
          cp "$temp_dir/canonical-app-build.gradle" pos-app/android/app/build.gradle

          cat > pos-app/android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF

          grep -q 'applicationId = "com.berkahtigaputeri.pos"' pos-app/android/app/build.gradle
          grep -q 'namespace = "com.berkahtigaputeri.pos"' pos-app/android/app/build.gradle

      - name: Install Android SDK platforms
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install compile platforms
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Build debug Android App Bundle
        working-directory: pos-app
        run: flutter build appbundle --debug --no-pub

      - name: Upload debug-only compile-check artifact
        uses: actions/upload-artifact@v4
        with:
          name: berkahtigaputeri-pos-debug-aab
          path: pos-app/build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 7
